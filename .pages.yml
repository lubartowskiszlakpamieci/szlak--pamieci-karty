media:
  input: public/images
  output: /images

content:
  - name: bastion
    label: Bastion Pamięci
    type: collection
    path: content/bastion
    filename: "{primary}.md"
    fields:
      - name: title
        label: Nazwa obiektu
        type: string

      - name: id
        label: Identyfikator
        type: string

      - name: category
        label: Kategoria
        type: select
        options:
          - Miejsce pamięci
          - Pomnik
          - Mogiła
          - Tablica
          - Budynek historyczny

      - name: address
        label: Lokalizacja
        type: string

      - name: latitude
        label: Szerokość geograficzna
        type: number

      - name: longitude
        label: Długość geograficzna
        type: number

      - name: period
        label: Okres historyczny
        type: string

      - name: description
        label: Opis historyczny
        type: rich-text

      - name: gallery
        label: Galeria zdjęć
        type: image
        list: true

      - name: sources
        label: Źródła
        type: text
        list: true

      - name: featured
        label: Wyróżniony obiekt
        type: boolean
        default: false